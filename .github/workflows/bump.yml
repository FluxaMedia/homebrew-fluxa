name: Bump cask

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update to the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh api repos/FluxaMedia/fluxa/releases/latest -q .tag_name)
          version=${tag#v}
          sha=$(gh api repos/FluxaMedia/fluxa/releases/latest \
            -q ".assets[] | select(.name == \"fluxa-$version-macos-arm64.dmg\") | .digest" | sed 's/^sha256://')
          [ -n "$sha" ] || exit 0
          sed -i -E "s/^  version \".*\"/  version \"$version\"/; s/^  sha256 \".*\"/  sha256 \"$sha\"/" Casks/fluxa.rb

      - name: Commit
        run: |
          git diff --quiet && exit 0
          version=$(sed -nE 's/^  version "(.*)"/\1/p' Casks/fluxa.rb)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "fluxa $version"
          git push
